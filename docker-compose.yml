services:
  # PostgreSQL: Direct relational & JSONB database for resumes, users, and settings
  postgres:
    image: postgres:16-alpine
    container_name: ggresume_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ggresume}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ggresume}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # GGResume Web App & Serverless API
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ggresume_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ggresume}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ggresume}
      - AUTH_LOCAL_MODE=${AUTH_LOCAL_MODE:-true}
      - NEXT_PUBLIC_AUTH_LOCAL_MODE=${NEXT_PUBLIC_AUTH_LOCAL_MODE:-true}
      - AUTH_SECRET=${AUTH_SECRET:-ggresume-secret-key-32-chars-minimum}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - EMAIL_FROM=${EMAIL_FROM:-GGResume <noreply@ggresume.com>}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
